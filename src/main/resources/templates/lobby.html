<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title th:text="'Sala ' + ${code}">Sala</title>
  <link rel="stylesheet" href="/lobby.css">
</head>
<body>
  <div class="card">
    <h2 class="title">Lobby — sala <span id="code" th:text="${code}">XXXX</span></h2>

    <!-- LOBBY -->
    <section id="lobbyView">
      <div id="joinBox" class="row">
        <input id="nickname" placeholder="Tu nombre"/>
        <button onclick="join()">Unirse</button>
      </div>

      <p class="muted section-title">Jugadores</p>
      <ul id="players"></ul>

      <div class="row">
        <button id="startBtn" class="ok" disabled onclick="startGame()">Iniciar partida</button>
        <span id="status" class="muted"></span>
      </div>
      <div id="modeSelector" class="row" style="margin-bottom: 0.5rem; display: none;">
        <span class="muted" style="margin-right: 0.5rem;">Modo:</span>
        <button id="btnFast" type="button" class="pill" onclick="setMode('FAST')">Rápido</button>
        <button id="btnManual" type="button" class="pill" onclick="setMode('MANUAL')">Manual</button>
      </div>

      
    </section>

    <!-- PROMPT / SUBMITTING -->
    <section id="playView" class="hidden">
      <div class="row">
        <span id="phasePill" class="pill">PROMPT</span>
        <span id="deadline" class="pill countdown mono">00:00</span>
      </div>
      <h3 id="promptText" style="margin:.25rem 0 0">…</h3>

      <div class="spacer"></div>
      <div class="row">
        <input id="answerInput" placeholder="Escribe tu respuesta…" />
        <button id="sendAnswerBtn" class="btn-secondary" onclick="sendAnswer()">Enviar</button>
      </div>
      <p id="playHint" class="muted">Esperando a que empiece la ronda…</p>
      <div class="hr"></div>
      <button class="btn-secondary btn-block" onclick="backToLobby()">Volver al lobby</button>
    </section>
    <!-- VOTING -->
    <section id="votingView" class="hidden">
      <div class="row">
        <span class="pill">VOTACIÓN</span>
        <span id="votingDeadline" class="pill countdown mono">00:00</span>
      </div>
      <p class="muted">Vota tu respuesta favorita:</p>
      <ul id="answersList"></ul>
      <div class="hr"></div>
      <button class="btn-secondary btn-block" onclick="backToLobby()">Volver al lobby</button>
    </section>
    <!-- SCORING -->
    <section id="scoreView" class="hidden">
      <div class="row">
        <span class="pill">PUNTUACIÓN</span>
        <span id="scoreDeadline" class="pill countdown mono">00:00</span>
      </div>
      <p class="muted">Mostrando puntuaciones…</p>
      <ul id="scorePlayers"></ul>
      <div class="hr"></div>
      <button class="btn-secondary btn-block" onclick="backToLobby()">Volver al lobby</button>
    </section>
    <div class="hr"></div>
    <pre id="log" class="muted mono"></pre>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

  <script th:inline="javascript">
    const CODE = /*[[${code}]]*/ "XXXX";
    const WS_ENDPOINT = /*[[${wsEndpoint}]]*/ "/ws";
    const ROOM_TOPIC  = /*[[${roomTopic}]]*/ "/topic/rooms/XXXX";
  </script>

  <script>
    // -------------------- State / helpers --------------------
    //const log = m => document.getElementById('log').textContent += m + "\n";
    const log = m => {
      const el = document.getElementById('log');
      el.textContent += m + "\n";
      el.scrollTop = el.scrollHeight; // <-- autoscroll al final
    };
    let PLAYER_TOKEN = localStorage.getItem(`sprinky:${CODE}:token`) || null;
    let PLAYER_ID    = localStorage.getItem(`sprinky:${CODE}:id`)    || null;

    // si quedó token viejo sin id, forzamos rejoin
    if (PLAYER_TOKEN && !PLAYER_ID) {
      localStorage.removeItem(`sprinky:${CODE}:token`);
      PLAYER_TOKEN = null;
    }

    let LAST_STATE = null;
    let DEADLINE_MS = 0;
    let countdownTimer = null;
    let stayInLobby = false;

    const $ = sel => document.querySelector(sel);
    const show = (id, on=true) => (document.getElementById(id).classList.toggle('hidden', !on), on);

    function setCountdown(target, elId){
      clearInterval(countdownTimer);
      function tick(){
        const now = Date.now();
        const left = Math.max(0, target - now);
        const s = Math.ceil(left/1000);
        const mm = String(Math.floor(s/60)).padStart(2,'0');
        const ss = String(s%60).padStart(2,'0');
        document.getElementById(elId).textContent = `${mm}:${ss}`;
        if(left <= 0){
          clearInterval(countdownTimer);
        }
      }
      tick();
      countdownTimer = setInterval(tick, 250);
    }

    // -------------------- Initial refresh --------------------
    refresh();

    // -------------------- WebSocket --------------------
    const sock = new SockJS(WS_ENDPOINT);
    const stomp = Stomp.over(sock); stomp.debug = null;
    stomp.connect({}, () => {
      log("WS conectado");
      stomp.subscribe(ROOM_TOPIC, msg => {
        log("UPDATE: " + msg.body);
        refresh(); // rehidrata con GET
      });
    }, err => log("WS ERROR: " + err));

    // -------------------- REST / UI logic --------------------
    async function refresh(){
      if(stayInLobby) return; // si estamos en lobby, no refrescar
      const res = await fetch(`/rooms/${CODE}`);
      if(!res.ok){ log("No se pudo cargar room"); return; }
      const room = await res.json();

      // Players list (en lobby)
      const ul = document.getElementById('players'); ul.innerHTML = "";
      const players = (room.players || []);
      players.forEach(p => {
        const li = document.createElement('li');
        li.textContent = `${p.nick} (${p.score ?? 0})`;
        ul.appendChild(li);
      });

      // lobby controls
      document.getElementById('startBtn').disabled = players.length < 2 || !PLAYER_TOKEN;
      document.getElementById('status').textContent =
        players.length < 2 ? "Esperando a que se una otra persona…" :
        (!PLAYER_TOKEN ? "Únete para poder iniciar." : "Listo para iniciar.");

      if(PLAYER_TOKEN){
        document.getElementById('joinBox').style.display = 'none';
      }

      // phase switch
      const state = room.state || "LOBBY";
      LAST_STATE = state;
      DEADLINE_MS = room.deadlineEpochMs || 0;
      //const esHost = room.firstPlayerId && room.firstPlayerId === (room.players.find(p => p.token === PLAYER_TOKEN)?.id);
      
      const esHost = !!(room.firstPlayerId && PLAYER_ID && room.firstPlayerId === PLAYER_ID);

      document.getElementById("modeSelector").style.display = (state === "LOBBY" && esHost) ? "flex" : "none";
      document.getElementById("startBtn").style.display = esHost ? "inline-block" : "none";
      log(`first=${room.firstPlayerId} me=${PLAYER_ID} host=${esHost}`);

      if(state === "LOBBY"){
        showOnly("lobbyView");
        clearInterval(countdownTimer);
        document.getElementById("deadline").textContent = "00:00";
        document.getElementById("scoreDeadline").textContent = "00:00";
      }
      else if(state === "PROMPT" || state === "SUBMITTING"){
        // setup
        showOnly("playView");

        document.getElementById("promptText").textContent = room.promptText || "Sin frase";
        document.getElementById("phasePill").textContent = state;

        const answering = (state === "SUBMITTING");
        document.getElementById("answerInput").disabled = !answering;
        document.getElementById("sendAnswerBtn").disabled = !answering;

        document.getElementById("playHint").textContent =
          answering ? "¡Responde ahora! Tienes poco tiempo." : "Leyendo el prompt… en breve podrás responder.";

        clearInterval(countdownTimer);
        if(DEADLINE_MS > 0) setCountdown(DEADLINE_MS, "deadline");
        else document.getElementById("deadline").textContent = "00:00";
      }
      else if(state === "VOTING"){
      showOnly("votingView");

        // Mostrar las respuestas para votar
        const answersList = document.getElementById('answersList');
        answersList.innerHTML = "";
        if(room.answers){
          Object.entries(room.answers).forEach(([playerId, answer]) => {
            const li = document.createElement('li');
            li.textContent = answer;
            // Aquí puedes añadir un botón para votar
            const btn = document.createElement('button');
            btn.textContent = "Votar";
            btn.onclick = () => voteAnswer(playerId);
            li.appendChild(btn);
            answersList.appendChild(li);
          });
        }

        clearInterval(countdownTimer);
        if(DEADLINE_MS > 0) setCountdown(DEADLINE_MS, "votingDeadline");
        else document.getElementById("votingDeadline").textContent = "00:00";
      }
      else if(state === "SCORING"){
      showOnly("scoreView");

        // pintar scores actuales
        const sul = document.getElementById('scorePlayers'); sul.innerHTML = "";
        players
          .sort((a,b)=>(b.score??0)-(a.score??0))
          .forEach(p => {
            const li = document.createElement('li');
            li.textContent = `${p.nick} — ${p.score ?? 0} pts`;
            sul.appendChild(li);
          });
        clearInterval(countdownTimer);
        if(DEADLINE_MS > 0) setCountdown(DEADLINE_MS, "scoreDeadline");
        else document.getElementById("scoreDeadline").textContent = "00:00";
      }
    }

    async function join(){
      const nick = document.getElementById('nickname').value.trim();
      if(!nick) return;
      const r = await fetch(`/rooms/${CODE}/join`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ nickname: nick })
      });
      if(!r.ok){ log("Join falló"); return; }
  
      const data = await r.json(); // { playerId, playerToken }
      PLAYER_TOKEN = data.playerToken;
      PLAYER_ID    = data.playerId; 
      localStorage.setItem(`sprinky:${CODE}:token`, PLAYER_TOKEN);
      localStorage.setItem(`sprinky:${CODE}:id`,    PLAYER_ID);

      document.getElementById('joinBox').style.display = 'none';
      refresh();
    }

    async function startGame(){
      const r = await fetch(`/rooms/${CODE}/start`, {
        method:'POST',
        headers: { 'X-Player-Token': PLAYER_TOKEN }
      });
      if(r.status === 202) log("Partida iniciada 🎉");
      else if(r.status === 403) log("Solo el primero que entró puede iniciar.");
      else if(r.status === 409) log("Necesitáis al menos 2 jugadores o ya está iniciada.");
      else if(r.status === 401) log("Falta autenticación.");
      else log("No se pudo iniciar.");
    }

    async function sendAnswer(){
      const input = document.getElementById('answerInput');
      const val = input.value.trim();
      if(!val){ input.focus(); return; }
      try{
        const r = await fetch(`/rooms/${CODE}/answer`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'X-Player-Token': PLAYER_TOKEN },
          body: JSON.stringify({ answer: val })
        });
        if(r.ok){
          log("Respuesta enviada ✅");
          input.value = "";
          input.disabled = true;
          document.getElementById('sendAnswerBtn').disabled = true;
          document.getElementById('playHint').textContent = "Respuesta enviada. Espera a puntuación…";
        }else{
          log("No se pudo enviar la respuesta.");
        }
      }catch(e){
        log("Error de red al enviar respuesta.");
      }
    }

    function backToLobby(){
      stayInLobby = true;
      show("lobbyView", true);
      show("playView", false);
      show("scoreView", false);
    }

    async function voteAnswer(playerId){
      const r = await fetch(`/rooms/${CODE}/vote`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'X-Player-Token': PLAYER_TOKEN },
        body: JSON.stringify({ playerId })
      });
      if(r.ok){
        log("¡Voto enviado!");
      }else{
        log("No se pudo votar.");
      }
    }

    function showOnly(idToShow) {
      ["lobbyView", "playView", "scoreView", "votingView"].forEach(id =>
        document.getElementById(id).classList.toggle('hidden', id !== idToShow)
      );
    }

    async function setMode(mode) {
      const r = await fetch(`/rooms/${CODE}/mode`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Player-Token': PLAYER_TOKEN },
        body: JSON.stringify({ mode })
      });
      if (r.ok) {
        log("Modo cambiado a " + mode);
      } else {
        log("No se pudo cambiar el modo.");
      }
    }
  </script>
</body>
</html>
